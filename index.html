<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&hearts;TIC TAC TOE&hearts;</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="start-menu ">
        <h1 id="title">TIC-TAC-TOE</h1>
        <p id="heading-msg">&#10060; vs &#11093;</p>
        <button id="start-button">Start Game</button>
    </div>

    <div class="msgcontainer hide">
        <p id="msg">Winner</p>
    </div>
    
    <p class="drawmsg hide">Draw</p>

    

    <div class="main-game hide">
        <div class="container">
            <p class="turn ">Player O's turn</p>
            <div class="game">
                <button id="box0" class="button"></button>
                <button id="box1" class="button"></button>
                <button id="box2" class="button"></button>
                <button id="box3" class="button"></button>
                <button id="box4" class="button"></button>
                <button id="box5" class="button"></button>
                <button id="box6" class="button"></button>
                <button id="box7" class="button"></button>
                <button id="box8" class="button"></button>
            </div>
        </div>

        <div class="score-board">
            <button id="x-score-button" role="x-score" class="scorebutton"><p id="xscoremsg" class="sbmsg">Player &#10060;</p><span id="x-score">0</span></button>
            <button id="o-score-button" role="o-score" class="scorebutton"><p id="oscoremsg" class="sbmsg">Player &#11093;</p><span id="o-score">0</span></button>
        </div>

        <div class="panel">
            <div class="newgame-container">
                <button class="newgame">New Game</button>
            </div>
            <div class="round-container">
                <button class="reset">Reset Round</button>
                <button class="next hide">Next Round</button>
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
